<svg xmlns="http://www.w3.org/2000/svg" width="680" height="386" viewBox="0 0 680 386" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Comparison of traffic distribution to four instances with cross-zone off and on for a two-AZ NLB."><style>.dg-node,.dg-edge,.fl-node{animation:dg-in .45s ease-out both}.fl-edge{animation:fl-fade .5s ease-out both}.dg-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dg-draw .7s ease-out forwards}@keyframes dg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes fl-fade{from{opacity:0}to{opacity:1}}@keyframes dg-draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.dg-node,.dg-edge,.fl-node,.fl-edge,.dg-draw{animation:none!important;opacity:1;stroke-dashoffset:0}.dg-dot{display:none}}</style><defs><marker id="va" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a8c"/></marker><filter id="vinv" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-1 0 0 0 0.92 0 -1 0 0 0.92 0 0 -1 0 0.92 0 0 0 1 0"/></filter></defs><rect width="100%" height="100%" fill="#ffffff"/><g class="fl-node" style="animation-delay:0.00s"><rect x="200" y="18" width="215" height="58" rx="8" fill="#eef0fe" stroke="#6b5bd6" stroke-width="1.6"/><image href="data:image/svg+xml;base64," x="212" y="35" width="24" height="24"/><text x="246" y="44.5" font-size="14" font-weight="700" fill="#3c3489">Cross-zone OFF</text><text x="246" y="60.5" font-size="11.5" font-weight="400" fill="#5b6b80">NLB default</text></g><g class="fl-node" style="animation-delay:0.18s"><rect x="425" y="18" width="215" height="58" rx="8" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.3"/><image href="data:image/svg+xml;base64," x="437" y="35" width="24" height="24"/><text x="471" y="44.5" font-size="14" font-weight="700" fill="#16243a">Cross-zone ON</text><text x="471" y="60.5" font-size="11.5" font-weight="400" fill="#5b6b80">after step 9</text></g><g class="fl-node" style="animation-delay:0.36s"><rect x="40" y="88" width="600" height="38" rx="6" fill="#eef2f7" stroke="#eef2f7" stroke-width="0"/><text x="52" y="111.5" font-size="12.5" font-weight="600" fill="#16243a">tracking-a1 (AZ-a)</text><path d="M213,102 L222,111 M222,102 L213,111" fill="none" stroke="#c4362c" stroke-width="2.2" stroke-linejoin="round"/><text x="232" y="111.5" font-size="12.5" font-weight="400" fill="#16243a">50% traffic, 3x load</text><path d="M437,107 L441,111 L448,103" fill="none" stroke="#1e8e4f" stroke-width="2.2" stroke-linejoin="round"/><text x="457" y="111.5" font-size="12.5" font-weight="400" fill="#16243a">25% traffic</text></g><g class="fl-node" style="animation-delay:0.47s"><text x="52" y="153.5" font-size="12.5" font-weight="600" fill="#16243a">tracking-b1/b2/b3</text><path d="M212,149 L223,149" fill="none" stroke="#c98a12" stroke-width="2.6" stroke-linejoin="round"/><text x="232" y="153.5" font-size="12.5" font-weight="400" fill="#16243a">about 16.7% each</text><path d="M437,149 L441,153 L448,145" fill="none" stroke="#1e8e4f" stroke-width="2.2" stroke-linejoin="round"/><text x="457" y="153.5" font-size="12.5" font-weight="400" fill="#16243a">25% each</text></g><g class="fl-node" style="animation-delay:0.58s"><rect x="40" y="172" width="600" height="52" rx="6" fill="#eef2f7" stroke="#eef2f7" stroke-width="0"/><text x="52" y="195" font-size="12.5" font-weight="600" fill="#16243a">AZ-a loses healthy</text><text x="52" y="210" font-size="12.5" font-weight="600" fill="#16243a">targets</text><path d="M213,193 L222,202 M222,193 L213,202" fill="none" stroke="#c4362c" stroke-width="2.2" stroke-linejoin="round"/><text x="232" y="202.5" font-size="12.5" font-weight="400" fill="#16243a">AZ-a node cannot serve</text><path d="M437,198 L441,202 L448,194" fill="none" stroke="#1e8e4f" stroke-width="2.2" stroke-linejoin="round"/><text x="457" y="202.5" font-size="12.5" font-weight="400" fill="#16243a">AZ-a node forwards to AZ-b</text></g><g class="fl-node" style="animation-delay:0.68s"><text x="52" y="251" font-size="12.5" font-weight="600" fill="#16243a">Cross-AZ data</text><text x="52" y="266" font-size="12.5" font-weight="600" fill="#16243a">transfer cost</text><path d="M212,254 L216,258 L223,250" fill="none" stroke="#1e8e4f" stroke-width="2.2" stroke-linejoin="round"/><text x="232" y="258.5" font-size="12.5" font-weight="400" fill="#16243a">none from cross-zone</text><path d="M437,254 L448,254" fill="none" stroke="#c98a12" stroke-width="2.6" stroke-linejoin="round"/><text x="457" y="258.5" font-size="12.5" font-weight="400" fill="#16243a">billed on NLB</text></g><g class="fl-node" style="animation-delay:0.88s"><text x="52" y="312" font-size="12.5" font-weight="700" fill="#5b6b80">Choose when…</text><rect x="200" y="290" width="215" height="78" rx="6" fill="#eef0fe" stroke="#6b5bd6" stroke-width="1"/><text x="212" y="311" font-size="12" font-weight="400" fill="#3c3489">OFF: choose when you</text><text x="212" y="326" font-size="12" font-weight="400" fill="#3c3489">deliberately want zonal</text><text x="212" y="341" font-size="12" font-weight="400" fill="#3c3489">isolation AND each AZ has</text><text x="212" y="356" font-size="12" font-weight="400" fill="#3c3489">enough capacity.</text><rect x="425" y="290" width="215" height="78" rx="6" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/><text x="437" y="311" font-size="12" font-weight="400" fill="#16243a">ON: choose when targets are</text><text x="437" y="326" font-size="12" font-weight="400" fill="#16243a">not guaranteed to be even per</text><text x="437" y="341" font-size="12" font-weight="400" fill="#16243a">AZ or when even distribution</text><text x="437" y="356" font-size="12" font-weight="400" fill="#16243a">and HA are the priority.</text></g></svg>
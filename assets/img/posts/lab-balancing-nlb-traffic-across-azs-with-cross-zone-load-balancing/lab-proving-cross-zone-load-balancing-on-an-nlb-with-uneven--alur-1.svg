<svg xmlns="http://www.w3.org/2000/svg" width="680" height="534" viewBox="0 0 680 534" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Decision of the NLB node in AZ-a: cross-zone expands target selection to all AZs; without cross-zone, the node depends entirely on targets in its own AZ."><style>.dg-node,.dg-edge,.fl-node{animation:dg-in .45s ease-out both}.fl-edge{animation:fl-fade .5s ease-out both}.dg-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dg-draw .7s ease-out forwards}@keyframes dg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes fl-fade{from{opacity:0}to{opacity:1}}@keyframes dg-draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.dg-node,.dg-edge,.fl-node,.fl-edge,.dg-draw{animation:none!important;opacity:1;stroke-dashoffset:0}.dg-dot{display:none}}</style><defs><marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a8c"/></marker><filter id="finv" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-1 0 0 0 0.92 0 -1 0 0 0.92 0 0 -1 0 0.92 0 0 0 1 0"/></filter></defs><rect width="100%" height="100%" fill="#ffffff"/><g class="fl-edge" style="animation-delay:0.45s"><path d="M240,80 L240,118" fill="none" stroke="#3a5a8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#fa)"/></g><g class="fl-edge" style="animation-delay:0.77s"><path d="M240,200 L240,238" fill="none" stroke="#3a5a8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#fa)"/></g><g class="fl-edge" style="animation-delay:0.61s"><path d="M356,160 L430,160" fill="none" stroke="#3a5a8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#fa)"/></g><g class="fl-edge" style="animation-delay:0.77s"><path d="M534,188 L534,243" fill="none" stroke="#3a5a8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#fa)"/></g><g class="fl-edge" style="animation-delay:0.93s"><path d="M534,301 L534,344" fill="none" stroke="#3a5a8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#fa)"/></g><g class="fl-edge" style="animation-delay:0.93s"><path d="M432,273 L394,273 L394,474 L430,474" fill="none" stroke="#3a5a8c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#fa)"/></g><g class="fl-edge" style="animation-delay:0.77s"><text x="248" y="223" text-anchor="start" font-size="11" font-weight="600" fill="#3a4a60" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="248" dy="0">Yes</tspan></text></g><g class="fl-edge" style="animation-delay:0.61s"><text x="394" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#3a4a60" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="394" dy="0">No</tspan></text></g><g class="fl-edge" style="animation-delay:0.93s"><text x="542" y="327.5" text-anchor="start" font-size="11" font-weight="600" fill="#3a4a60" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="542" dy="0">Yes</tspan></text></g><g class="fl-edge" style="animation-delay:0.93s"><text x="388" y="377.5" text-anchor="end" font-size="11" font-weight="600" fill="#3a4a60" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="388" dy="0">No</tspan></text></g><g class="fl-node" style="animation-delay:0.00s"><rect x="124" y="24" width="232" height="56" rx="28" fill="#eef3fa" stroke="#3a5a8c" stroke-width="1.8"/><image href="data:image/svg+xml;base64," x="140" y="39" width="26" height="26"/><text x="176" y="47.5" font-size="13" font-weight="600" fill="#16243a">Incoming connection to</text><text x="176" y="63.5" font-size="13" font-weight="600" fill="#16243a">AZ-a node</text></g><g class="fl-node" style="animation-delay:0.32s"><rect x="124" y="120" width="232" height="80" rx="8" fill="#fff6e0" stroke="#c98a12" stroke-width="1.8"/><text x="140" y="141.5" font-size="13" font-weight="600" fill="#16243a">Cross-zone effectively</text><text x="140" y="157.5" font-size="13" font-weight="600" fill="#16243a">enabled?</text><text x="140" y="174.5" font-size="11.5" fill="#5b6b80">TG setting first, then LB</text><text x="140" y="188.5" font-size="11.5" fill="#5b6b80">setting</text></g><g class="fl-node" style="animation-delay:0.64s"><rect x="124" y="240" width="232" height="66" rx="8" fill="#e7f5ec" stroke="#1e8e4f" stroke-width="1.8"/><path d="M136,273 L140,277 L148,268" fill="none" stroke="#1e8e4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="158" y="261.5" font-size="13" font-weight="600" fill="#16243a">Pick healthy target in</text><text x="158" y="277.5" font-size="13" font-weight="600" fill="#16243a">all AZs</text><text x="158" y="294.5" font-size="11.5" fill="#5b6b80">a1, b1, b2, b3</text></g><g class="fl-node" style="animation-delay:0.48s"><rect x="432" y="132" width="204" height="56" rx="8" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.2"/><text x="448" y="163.5" font-size="13" font-weight="600" fill="#16243a">Restrict to AZ-a targets</text></g><g class="fl-node" style="animation-delay:0.64s"><rect x="432" y="245" width="204" height="56" rx="8" fill="#fff6e0" stroke="#c98a12" stroke-width="1.8"/><text x="448" y="268.5" font-size="13" font-weight="600" fill="#16243a">Any healthy target in</text><text x="448" y="284.5" font-size="13" font-weight="600" fill="#16243a">AZ-a?</text></g><g class="fl-node" style="animation-delay:0.80s"><rect x="432" y="346" width="204" height="56" rx="8" fill="#e7f5ec" stroke="#1e8e4f" stroke-width="1.8"/><path d="M444,374 L448,378 L456,369" fill="none" stroke="#1e8e4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="466" y="377.5" font-size="13" font-weight="600" fill="#16243a">Served by tracking-a1</text></g><g class="fl-node" style="animation-delay:0.80s"><rect x="432" y="442" width="204" height="64" rx="8" fill="#fdecea" stroke="#c4362c" stroke-width="1.8"/><path d="M445,469 L455,479 M455,469 L445,479" stroke="#c4362c" stroke-width="2" stroke-linecap="round"/><text x="466" y="463.5" font-size="13" font-weight="600" fill="#16243a">Connection fails</text><text x="466" y="480.5" font-size="11.5" fill="#5b6b80">timeout, node removed</text><text x="466" y="494.5" font-size="11.5" fill="#5b6b80">from DNS</text></g></svg>
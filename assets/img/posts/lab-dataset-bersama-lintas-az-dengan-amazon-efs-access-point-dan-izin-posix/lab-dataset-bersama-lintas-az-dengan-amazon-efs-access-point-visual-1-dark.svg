<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Empat lapis kontrol akses NFS ke EFS."><style>.dg-node,.dg-edge,.fl-node{animation:dg-in .45s ease-out both}.fl-edge{animation:fl-fade .5s ease-out both}.dg-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dg-draw .7s ease-out forwards}@keyframes dg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes fl-fade{from{opacity:0}to{opacity:1}}@keyframes dg-draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.dg-node,.dg-edge,.fl-node,.fl-edge,.dg-draw{animation:none!important;opacity:1;stroke-dashoffset:0}.dg-dot{display:none}}</style><defs><marker id="va" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fb4ff"/></marker><filter id="vinv" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-1 0 0 0 0.92 0 -1 0 0 0.92 0 0 -1 0 0.92 0 0 0 1 0"/></filter></defs><rect width="100%" height="100%" fill="#1b1b1e"/><g class="fl-node" style="animation-delay:0.00s"><circle cx="60" cy="45" r="15" fill="#5a6372"/><text x="60" y="50" font-size="13" font-weight="700" fill="#1b1b1e" text-anchor="middle">1</text><rect x="92" y="18" width="548" height="54" rx="8" fill="#24262b" stroke="#5a6372" stroke-width="1.5"/><text x="108" y="42" font-size="13.5" font-weight="700" fill="#e6e8ec">Security group</text><text x="108" y="60" font-size="11.5" font-weight="400" fill="#a6aeba">jaringan: TCP 2049 dari SG klien saja</text></g><g class="fl-edge" style="animation-delay:0.09s"><path d="M60,60 L60,92" fill="none" stroke="#8fb4ff" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#va)"/></g><g class="fl-node" style="animation-delay:0.18s"><circle cx="60" cy="109" r="15" fill="#9d93f0"/><text x="60" y="114" font-size="13" font-weight="700" fill="#1b1b1e" text-anchor="middle">2</text><rect x="92" y="82" width="548" height="54" rx="8" fill="#26244a" stroke="#9d93f0" stroke-width="1.5"/><text x="108" y="106" font-size="13.5" font-weight="700" fill="#d9d5ff">File system policy</text><text x="108" y="124" font-size="11.5" font-weight="400" fill="#a6aeba">IAM: role X wajib via access point X</text></g><g class="fl-edge" style="animation-delay:0.27s"><path d="M60,124 L60,156" fill="none" stroke="#8fb4ff" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#va)"/></g><g class="fl-node" style="animation-delay:0.36s"><circle cx="60" cy="173" r="15" fill="#e0a83a"/><text x="60" y="178" font-size="13" font-weight="700" fill="#1b1b1e" text-anchor="middle">3</text><rect x="92" y="146" width="548" height="54" rx="8" fill="#3a2e14" stroke="#e0a83a" stroke-width="1.5"/><text x="108" y="170" font-size="13.5" font-weight="700" fill="#ffe6b0">Access point</text><text x="108" y="188" font-size="11.5" font-weight="400" fill="#a6aeba">paksa UID/GID + root directory</text></g><g class="fl-edge" style="animation-delay:0.45s"><path d="M60,188 L60,220" fill="none" stroke="#8fb4ff" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#va)"/></g><g class="fl-node" style="animation-delay:0.54s"><circle cx="60" cy="237" r="15" fill="#4cc47e"/><text x="60" y="242" font-size="13" font-weight="700" fill="#1b1b1e" text-anchor="middle">4</text><rect x="92" y="210" width="548" height="54" rx="8" fill="#173326" stroke="#4cc47e" stroke-width="1.5"/><text x="108" y="234" font-size="13.5" font-weight="700" fill="#c9f0d8">Izin POSIX</text><text x="108" y="252" font-size="11.5" font-weight="400" fill="#a6aeba">rwx owner/group/other per file/dir</text></g><text x="92" y="288" font-size="12" font-weight="400" fill="#a6aeba">Request harus lolos semua lapisan, dari atas ke bawah.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Four layers of NFS access control to EFS." xmlns:c2pa="http://c2pa.org/manifest"><style>.dg-node,.dg-edge,.fl-node{animation:dg-in .45s ease-out both}.fl-edge{animation:fl-fade .5s ease-out both}.dg-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dg-draw .7s ease-out forwards}@keyframes dg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes fl-fade{from{opacity:0}to{opacity:1}}@keyframes dg-draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.dg-node,.dg-edge,.fl-node,.fl-edge,.dg-draw{animation:none!important;opacity:1;stroke-dashoffset:0}.dg-dot{display:none}}</style><defs><marker id="va" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a8c"/></marker><filter id="vinv" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-1 0 0 0 0.92 0 -1 0 0 0.92 0 0 -1 0 0.92 0 0 0 1 0"/></filter></defs><rect width="100%" height="100%" fill="#ffffff"/><g class="fl-node" style="animation-delay:0.00s"><circle cx="60" cy="45" r="15" fill="#b8c4d4"/><text x="60" y="50" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="92" y="18" width="548" height="54" rx="8" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.5"/><text x="108" y="42" font-size="13.5" font-weight="700" fill="#16243a">Security group</text><text x="108" y="60" font-size="11.5" font-weight="400" fill="#5b6b80">network: TCP 2049 from the client SG only</text></g><g class="fl-edge" style="animation-delay:0.09s"><path d="M60,60 L60,92" fill="none" stroke="#3a5a8c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#va)"/></g><g class="fl-node" style="animation-delay:0.18s"><circle cx="60" cy="109" r="15" fill="#6b5bd6"/><text x="60" y="114" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="92" y="82" width="548" height="54" rx="8" fill="#eef0fe" stroke="#6b5bd6" stroke-width="1.5"/><text x="108" y="106" font-size="13.5" font-weight="700" fill="#3c3489">File system policy</text><text x="108" y="124" font-size="11.5" font-weight="400" fill="#5b6b80">IAM: role X must use access point X</text></g><g class="fl-edge" style="animation-delay:0.27s"><path d="M60,124 L60,156" fill="none" stroke="#3a5a8c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#va)"/></g><g class="fl-node" style="animation-delay:0.36s"><circle cx="60" cy="173" r="15" fill="#c98a12"/><text x="60" y="178" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="92" y="146" width="548" height="54" rx="8" fill="#fff6e0" stroke="#c98a12" stroke-width="1.5"/><text x="108" y="170" font-size="13.5" font-weight="700" fill="#7a520a">Access point</text><text x="108" y="188" font-size="11.5" font-weight="400" fill="#5b6b80">enforces UID/GID + root directory</text></g><g class="fl-edge" style="animation-delay:0.45s"><path d="M60,188 L60,220" fill="none" stroke="#3a5a8c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#va)"/></g><g class="fl-node" style="animation-delay:0.54s"><circle cx="60" cy="237" r="15" fill="#1e8e4f"/><text x="60" y="242" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><rect x="92" y="210" width="548" height="54" rx="8" fill="#e7f5ec" stroke="#1e8e4f" stroke-width="1.5"/><text x="108" y="234" font-size="13.5" font-weight="700" fill="#145c34">POSIX permissions</text><text x="108" y="252" font-size="11.5" font-weight="400" fill="#5b6b80">rwx owner/group/other per file/dir</text></g><text x="92" y="288" font-size="12" font-weight="400" fill="#5b6b80">A request must pass every layer, from top to bottom.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>